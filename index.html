<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Rêve — Cafe Malindi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #d98a95;
      --bg2: #b95f6e;
      --bg3: #9d4a58;
      --splash: #c96a78;
      --card: rgba(255,235,238,.55);
      --chipbg: rgba(255,255,255,.16);
      --cream: #F6E8D8;
      --ink: #3A2430;
      --ease-cine: cubic-bezier(.65,.05,.2,1);
      --ease-out: cubic-bezier(.22,1,.36,1);
      --ease-spring: cubic-bezier(.34,1.3,.64,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Manrope', sans-serif;
      color: var(--ink);
      background: #000;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    img { display: block; max-width: 100%; }

    .scene {
      position: relative;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(130% 100% at 50% -10%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
      transition: background 1s var(--ease-cine);
    }

    .bokeh { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .bokeh i {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.14);
      filter: blur(30px);
      animation: bokeh 9s ease-in-out infinite;
    }
    .bokeh i:nth-child(2) { animation-delay: -3s; }
    .bokeh i:nth-child(3) { animation-delay: -5s; }
    .bokeh i:nth-child(4) { animation-delay: -7s; }
    @keyframes bokeh { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-24px) scale(1.06); } }

    .splashPool {
      position: absolute;
      left: 50%;
      bottom: -6%;
      transform: translateX(-50%);
      pointer-events: none;
      height: min(58vh, 640px);
      aspect-ratio: 3 / 2;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,.18));
      z-index: 2;
    }
    .splashPool img {
      width: 100%; height: 100%; object-fit: cover; object-position: bottom;
      display: block;
      animation: poolmove 8s ease-in-out infinite;
    }
    @keyframes poolmove { 0%,100% { transform: translateX(-1.5%); } 50% { transform: translateX(1.5%); } }
    .splashPool.splash-now { animation: splashhit .85s var(--ease-spring); }
    @keyframes splashhit {
      0% { transform: translateX(-50%) scale(.72); opacity: .55; }
      60% { transform: translateX(-50%) scale(1.08); opacity: 1; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }

    .crown {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -53%);
      width: clamp(460px, 60vw, 900px);
      pointer-events: none;
      z-index: 6;
    }
    .crown img {
      width: 100%;
      display: block;
      animation: crownwob 5s ease-in-out infinite;
      transition: opacity .6s, transform .9s var(--ease-out);
    }
    @keyframes crownwob { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.025) rotate(-.6deg); } }
    .crown.pop2 { animation: crownpulse .9s var(--ease-out); }
    @keyframes crownpulse {
      0% { transform: translate(-50%, -53%) scale(.85); opacity: .4; }
      60% { transform: translate(-50%, -55%) scale(1.08); }
      100% { transform: translate(-50%, -53%) scale(1); }
    }

    .drinkwrap {
      position: absolute;
      left: 50%;
      top: 51%;
      transform: translate(-50%, -52%);
      z-index: 7;
      pointer-events: none;
    }
    .drinkwrap img {
      height: min(94vh, 1000px);
      filter: drop-shadow(0 60px 70px rgba(0,0,0,.4)) drop-shadow(0 24px 30px rgba(0,0,0,.28));
    }
    .drinkwrap .cup { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-16px) rotate(.7deg); } }
    .drinkwrap.pop .cup { animation: riseup .95s var(--ease-out), bob 6s ease-in-out .95s infinite; }
    @keyframes riseup {
      0% { transform: translateY(60vh) scale(.5); opacity: 0; }
      60% { transform: translateY(-4vh) scale(1.05); opacity: 1; }
      80% { transform: translateY(1vh); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .wordstage {
      position: absolute; inset: 0; z-index: 4; pointer-events: none;
      display: flex; align-items: center; overflow: hidden;
    }
    .bigword {
      position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%);
      font-family: 'Fraunces', serif; font-weight: 900; font-size: clamp(120px, 24vw, 360px);
      line-height: 1; color: var(--cream); opacity: .92; white-space: nowrap; letter-spacing: -.02em;
      text-shadow: 0 12px 40px rgba(0,0,0,.1);
    }
    .word-in { animation: win .85s var(--ease-cine) forwards; }
    .word-out { animation: wout .85s var(--ease-cine) forwards; }
    @keyframes win { from { transform: translate(60vw,-50%); opacity: .4; } to { transform: translate(-50%,-50%); opacity: 1; } }
    @keyframes wout { from { transform: translate(-50%,-50%); opacity: 1; } to { transform: translate(-110vw,-50%); opacity: .6; } }

    .nav {
      position: absolute;
      top: 0; left: 0; right: 0; z-index: 60;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px clamp(18px,3.4vw,44px);
      color: #fff;
    }
    .logo { font-family: 'Fraunces', serif; font-weight: 700; font-style: italic; font-size: 21px; }
    .navmid {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px; align-items: center;
      background: var(--chipbg); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 5px;
    }
    .navmid a {
      font: 600 12.5px/1 'Manrope'; padding: 9px 16px; border-radius: 999px; color: #fff; opacity: .85;
    }
    .navmid a.active { background: rgba(255,255,255,.92); color: var(--ink); opacity: 1; font-weight: 700; }
    .navright { display: flex; align-items: center; gap: 12px; }
    .icobtn {
      width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #fff; opacity: .85; cursor: pointer; border: 0; background: transparent;
    }
    .icobtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    .whitepill {
      background: #fff; color: #2b2b2b; border: 0; border-radius: 999px; padding: 12px 20px; font: 700 12px/1 'Manrope';
      cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,.16);
    }

    .sidechips {
      position: absolute; left: 50%; top: 27%; transform: translateX(-50%); z-index: 9; display: flex; gap: 9px;
    }
    .schip {
      font: 700 11px/1 'Manrope'; letter-spacing: .12em; text-transform: uppercase; color: #fff;
      background: rgba(0,0,0,.16); border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
      padding: 9px 16px; opacity: 0; transform: translateY(10px);
    }
    .schip.on { animation: chipin .6s var(--ease-out) forwards; }
    @keyframes chipin { to { opacity: 1; transform: none; } }

    .prodcard {
      position: absolute; left: clamp(18px,3.4vw,48px); bottom: clamp(22px,6vh,54px); z-index: 60;
      display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 22px;
      background: var(--card); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.45);
      box-shadow: 0 24px 50px -18px rgba(0,0,0,.28); max-width: min(480px, calc(100vw - 36px));
    }
    .stats { display: flex; flex-direction: column; gap: 7px; }
    .stat { background: rgba(255,255,255,.8); border-radius: 12px; padding: 8px 13px; text-align: center; min-width: 62px; }
    .stat b { display: block; font: 800 15px/1.1 'Manrope'; color: #333; }
    .stat span { font: 600 8.5px/1 'Manrope'; letter-spacing: .08em; text-transform: uppercase; color: #8a7a80; }
    .pthumb { width: 76px; height: 96px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .pthumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .pinfo { min-width: 0; }
    .pinfo h3 { font: 800 16px/1.2 'Manrope'; color: #3c2b33; }
    .pinfo p { margin-top: 4px; font: 500 11.5px/1.5 'Manrope'; color: rgba(60,43,51,.75); max-width: 190px; }
    .pact { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    .addbtn {
      background: #fff; color: #2b2b2b; border: 0; border-radius: 999px; padding: 11px 18px; font: 700 11.5px/1 'Manrope';
      cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.14);
    }
    .pinbtn {
      width: 36px; height: 36px; border-radius: 50%; background: #262626; border: 0; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .pinbtn svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .ring {
      position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); z-index: 8;
      width: clamp(200px,24vw,320px); height: clamp(200px,24vw,320px); pointer-events: none;
    }
    .ring svg { width: 100%; height: 100%; overflow: visible; }
    .ring .rot { animation: spin 16s linear infinite; transform-origin: 50% 50%; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ring text { font: 700 10px 'Manrope'; letter-spacing: .3em; text-transform: uppercase; fill: #fff; opacity: .95; }
    .ring .pct { font-family: 'Fraunces', serif; font-weight: 900; font-size: 19px; fill: #fff; letter-spacing: 0; }
    .ring .dia { fill: #fff; font-size: 11px; }

    .arrows { position: absolute; right: clamp(18px,3.4vw,48px); bottom: clamp(26px,6vh,54px); z-index: 50; display: flex; gap: 10px; }
    .arrow {
      width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 0; color: #2b2b2b; cursor: pointer;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(0,0,0,.18);
    }
    .arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    .dots { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50; display: flex; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.35); border: 0; cursor: pointer; }
    .dot.on { background: #fff; transform: scale(1.4); }
    .count { position: absolute; top: 92px; right: clamp(18px,3.4vw,48px); z-index: 30; font: 700 11px/1 'Manrope'; letter-spacing: .2em; color: #fff; opacity: .8; }

    .toast {
      position: fixed; left: 50%; bottom: 110px; transform: translate(-50%, 14px); z-index: 1600; background: #262626; color: #fff;
      font: 700 10px/1 'Manrope'; letter-spacing: .16em; text-transform: uppercase; padding: 13px 20px; border-radius: 999px; opacity: 0;
      transition: all .4s var(--ease-out); pointer-events: none;
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }

    .cart{position:fixed;top:0;left:0;right:0;z-index:1500;transform:translateY(-110%);transition:transform .7s var(--ease-cine);background:rgba(30,20,26,.96);backdrop-filter:blur(10px);color:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.6)}
    .cart.open{transform:none}
    .cart-in{padding:16px clamp(18px,4vw,44px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .cart .clabel{font:800 10px/1 'Manrope';letter-spacing:.26em;text-transform:uppercase;color:#e8b7c0;white-space:nowrap}
    .cart-items{display:flex;gap:10px;flex:1;overflow-x:auto;scrollbar-width:none;padding:4px 0}
    .cart-items::-webkit-scrollbar{display:none}
    .cline{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 8px 7px 14px;font:600 12px/1 'Manrope';white-space:nowrap}
    .cline b{font-weight:800}
    .cline .x{cursor:pointer;opacity:.6;border:0;background:none;color:#fff;font-size:14px;line-height:1;padding:2px 5px;border-radius:50%}
    .cline .x:hover{opacity:1;background:rgba(255,255,255,.12)}
    .cart-total{font-family:'Fraunces',serif;font-weight:900;font-size:20px;color:#e8b7c0;white-space:nowrap}
    .wabtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#2b2b2b;border-radius:999px;padding:13px 20px;font:800 11px/1 'Manrope';letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:0;}
    .cart .cls{background:none;border:0;color:#fff;opacity:.7;cursor:pointer;font-size:18px;line-height:1;padding:6px}
    .cart .cls:hover{opacity:1}

    @media (max-width:760px){
      .nav{padding:10px 12px 8px;flex-wrap:wrap;gap:8px}
      .logo{font-size:19px;font-weight:800;white-space:nowrap;flex-shrink:0}
      .navmid{position:static;transform:none;order:3;flex:0 0 100%;margin:0 auto;padding:5px;gap:2px;justify-content:center;width:max-content}
      .navmid a{padding:9px 14px;font-size:11px;font-weight:700;white-space:nowrap}
      .whitepill{padding:11px 16px;font-size:11px;font-weight:800;flex-shrink:0}
      .icobtn{width:30px;height:30px;flex-shrink:0}
      .navright{gap:6px}
      .bigword{font-size:clamp(72px,26vw,150px);top:31%}
      .drinkwrap{top:48%}
      .drinkwrap img{height:min(46vh,500px)}
      .crown{width:clamp(280px,88vw,420px)}
      .splashPool{height:min(23vh,250px);bottom:-4%}
      .prodcard{left:10px;right:10px;bottom:70px;max-width:none;padding:9px;gap:9px;border-radius:18px}
      .stats{flex-direction:row;gap:7px}
      .stat{padding:7px 10px;min-width:54px}
      .pthumb{width:48px;height:60px}
      .pinfo h3{font-size:15px}
      .pinfo p{font-size:11px;max-width:none}
      .addbtn{padding:10px 16px;font-size:10.5px}
      .pinbtn{width:32px;height:32px}
      .arrows{bottom:18px;right:12px;gap:8px}
      .arrow{width:42px;height:42px}
      .dots{bottom:30px;left:50%;right:auto;transform:translateX(-50%)}
      .count{display:none}
      .cline{font-size:11.5px;padding:6px 7px 6px 12px}
    }
  </style>
</head>
<body>
  <section class="scene" id="scene">
    <div class="bokeh">
      <i style="left:6%;top:14%;width:220px;height:220px"></i>
      <i style="right:8%;top:8%;width:260px;height:260px"></i>
      <i style="left:38%;top:4%;width:180px;height:180px"></i>
      <i style="right:30%;bottom:12%;width:240px;height:240px"></i>
    </div>

    <div class="splashPool"><img class="tint" id="poolImg" src="assets/gen/pool.webp" alt=""></div>
    <div class="wordstage" id="wordstage"></div>
    <div class="crown" id="crownBox"><img class="tint" id="crownImg" src="assets/gen/crown.webp" alt=""></div>
    <div class="drinkwrap" id="drinkwrap"><img class="cup" id="drinkImg" alt=""></div>

    <nav class="nav">
      <a class="logo" href="/"><span style="font-size:13px">✦</span>Le Rêve</a>
      <div class="navmid">
        <a href="/" class="active">Home</a>
        <a href="/menu.html">Our Shakes</a>
        <a href="#about">About Us</a>
        <a href="#contact">Contact</a>
      </div>
      <div class="navright">
        <button class="icobtn" id="searchBtn" aria-label="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="whitepill" id="orderPill">Order Now</button>
      </div>
    </nav>

    <div class="dots" id="dots"></div>
    <div class="count" id="count">01 / 11</div>

    <div class="sidechips" id="sidechips"></div>

    <div class="prodcard" id="prodcard">
      <div class="stats">
        <div class="stat"><b id="kcal">350</b><span>kcal</span></div>
        <div class="stat"><b id="ml">250</b><span>ml</span></div>
      </div>
      <div class="pthumb"><img id="thumb" alt=""></div>
      <div class="pinfo">
        <h3 id="pname">—</h3>
        <p id="pdesc">—</p>
        <div class="pact">
          <button class="addbtn" id="addBtn">Add to Cart</button>
          <button class="pinbtn" id="pinBtn" aria-label="find us on maps"><svg viewBox="0 0 24 24"><path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></button>
        </div>
      </div>
    </div>

    <div class="ring">
      <svg viewBox="0 0 118 118">
        <g class="rot">
          <defs><path id="cir" d="M59,59 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/></defs>
          <text><textPath href="#cir">real fruit · real fruit · real fruit · </textPath></text>
        </g>
        <text class="dia" x="59" y="40" text-anchor="middle">✦</text>
        <text class="pct" x="59" y="66" text-anchor="middle">100%</text>
      </svg>
    </div>

    <div class="arrows">
      <button class="arrow" id="prev" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="arrow" id="next" aria-label="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </section>

  <div class="cart" id="cart">
    <div class="cart-in">
      <span class="clabel">your order</span>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-row2">
        <span class="cart-total" id="cartTotal">KES 0</span>
        <button class="wabtn" id="orderNow">place order</button>
        <button class="cls" id="cartClose" aria-label="close">✕</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const MENU = [
      {id:'straw', name:'Strawberry Bliss', word:'Strawlicious', desc:'The famous one — berry first, coffee after', price:450, kcal:320, ml:350, img:'assets/straw_cut.webp', chips:['Fresh','Berry','Creamy'], bg1:'#d98a95', bg2:'#b95f6e', bg3:'#9d4a58', splash:'brightness(1.1) saturate(1.2)'} ,
      {id:'matcha', name:'Kiwi Breeze', word:'Kiwliciously', desc:'Smooth and refreshing with a subtle tangy note', price:450, kcal:280, ml:350, img:'assets/matcha_cut.webp', chips:['Exotic','Tangy','Cool'], bg1:'#a7c88e', bg2:'#6aa06e', bg3:'#4d7f68', splash:'brightness(1.08) saturate(1.15)'} ,
      {id:'mojito', name:'Grape Velvet', word:'Grapstical', desc:'Juicy grapes blended into a velvety milkshake base', price:480, kcal:340, ml:350, img:'assets/mojito_cut.webp', chips:['Juicy','Velvet','Chilled'], bg1:'#8f87d8', bg2:'#5f5ba9', bg3:'#403f7a', splash:'brightness(1.08) saturate(1.12)'} ,
      {id:'latte', name:'Iced Latte', word:'Lattelicious', desc:'Creamy coffee over ice, milk swirls', price:350, kcal:210, ml:350, img:'assets/latte_cut.webp', chips:['Creamy','Smooth','Bold'], bg1:'#d7b392', bg2:'#b8795a', bg3:'#8d5b48', splash:'brightness(1.1) saturate(1.05)'} ,
      {id:'brew', name:'Cold Brew To-Go', word:'Brewtanical', desc:'18 hours of patience, over ice', price:400, kcal:120, ml:350, img:'assets/brew_cut.webp', chips:['Bold','Dark','Cold'], bg1:'#8e7d75', bg2:'#655443', bg3:'#463b34', splash:'brightness(1.04) contrast(1.05)'} ,
      {id:'caramel', name:'Caramel Frappe', word:'Caramello', desc:'Whipped cloud, golden drizzle', price:480, kcal:390, ml:350, img:'assets/caramel_cut.webp', chips:['Golden','Sweet','Cloudy'], bg1:'#e5c28a', bg2:'#d99c62', bg3:'#b66d48', splash:'brightness(1.12) saturate(1.08)'} ,
      {id:'espresso', name:'Iced Espresso', word:'Espressoly', desc:'Short, dark, honest', price:300, kcal:90, ml:250, img:'assets/espresso_cut.webp', chips:['Short','Dark','Sharp'], bg1:'#9e7b67', bg2:'#765347', bg3:'#573f35', splash:'brightness(1.05) saturate(1.2)'} ,
      {id:'oreo', name:'Oreo Milkshake', word:'Oreolicious', desc:'Cookies & cream, crumb rim', price:450, kcal:420, ml:350, img:'assets/oreo_cut.webp', chips:['Cookie','Rich','Creamy'], bg1:'#a58a7d', bg2:'#7b665e', bg3:'#5e4f48', splash:'brightness(1.08) saturate(1.05)'} ,
      {id:'kitkat', name:'KitKat Shake', word:'Kitkalicious', desc:'Chocolate wafer crown', price:450, kcal:430, ml:350, img:'assets/kitkat_cut.webp', chips:['Chocolate','Crisp','Rich'], bg1:'#b18472', bg2:'#7e5646', bg3:'#5a3d38', splash:'brightness(1.1) saturate(1.08)'} ,
      {id:'donut', name:'Biscoff Donut', word:'Biscoffal', desc:'The famous one — goes fast', price:250, kcal:380, ml:120, img:'assets/donut_cut.webp', chips:['Spiced','Soft','Classic'], bg1:'#d9ae7e', bg2:'#b77a40', bg3:'#7b4f2d', splash:'brightness(1.1) saturate(1.16)'} ,
      {id:'cinnamon', name:'Cinnamon Roll', word:'Cinnamon', desc:'Glazed, warm from the case', price:300, kcal:410, ml:150, img:'assets/cinnamon_cut.webp', chips:['Glazed','Warm','Sweet'], bg1:'#d29779', bg2:'#b55f45', bg3:'#8f4139', splash:'brightness(1.12) saturate(1.1)'}
    ];

    const $ = (s) => document.querySelector(s);
    const money = (v) => 'KES ' + Math.round(v).toLocaleString('en-KE');
    let idx = 0, switching = false;

    function applyColors(item) {
      const root = document.documentElement.style;
      root.setProperty('--bg1', item.bg1);
      root.setProperty('--bg2', item.bg2);
      root.setProperty('--bg3', item.bg3);
      root.setProperty('--splash', item.splash);
      document.querySelectorAll('.tint').forEach((el) => {
        el.style.filter = item.splash + ' drop-shadow(0 10px 30px rgba(0,0,0,.18))';
      });
    }

    function showWord(word) {
      const stage = $('#wordstage');
      stage.querySelectorAll('.bigword').forEach((w) => {
        w.classList.remove('word-in');
        void w.offsetWidth;
        w.classList.add('word-out');
        setTimeout(() => w.remove(), 850);
      });
      const el = document.createElement('h1');
      el.className = 'bigword word-in';
      el.textContent = word;
      stage.appendChild(el);
    }

    function showChips(chips) {
      const box = $('#sidechips');
      box.innerHTML = '';
      chips.forEach((c, i) => {
        const s = document.createElement('span');
        s.className = 'schip';
        s.textContent = c;
        s.style.animationDelay = (0.25 + i * 0.12) + 's';
        s.classList.add('on');
        box.appendChild(s);
      });
    }

    function showCard(item, animate) {
      const card = $('#prodcard');
      $('#kcal').textContent = item.kcal;
      $('#ml').textContent = item.ml;
      $('#thumb').src = item.img;
      $('#thumb').alt = item.name;
      $('#pname').textContent = item.name;
      $('#pdesc').textContent = item.desc;
      if (!animate) return;
      card.style.transition = 'transform .35s ease, opacity .35s ease';
      card.style.transform = 'translateX(-15px)';
      card.style.opacity = '0';
      setTimeout(() => {
        card.style.transform = 'translateX(0)';
        card.style.opacity = '1';
      }, 180);
    }

    function go(i) {
      if (switching) return;
      switching = true;
      idx = (i + MENU.length) % MENU.length;
      const item = MENU[idx];

      applyColors(item);
      showWord(item.word);
      showChips(item.chips);
      showCard(item, true);

      const dw = $('#drinkwrap');
      const img = $('#drinkImg');
      img.src = item.img;
      img.alt = item.name;
      dw.classList.remove('pop');
      void dw.offsetWidth;
      dw.classList.add('pop');

      const cb = $('#crownBox');
      cb.classList.remove('pop2');
      void cb.offsetWidth;
      cb.classList.add('pop2');

      const pool = document.querySelector('.splashPool');
      pool.classList.remove('splash-now');
      void pool.offsetWidth;
      pool.classList.add('splash-now');

      $('#count').textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(MENU.length).padStart(2, '0');
      document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j === idx));
      setTimeout(() => switching = false, 480);
    }

    MENU.forEach((item, i) => {
      const d = document.createElement('button');
      d.className = 'dot';
      d.setAttribute('aria-label', item.name);
      d.addEventListener('click', () => go(i));
      $('#dots').appendChild(d);
    });
    $('#count').textContent = '01 / ' + String(MENU.length).padStart(2, '0');

    $('#next').addEventListener('click', () => go(idx + 1));
    $('#prev').addEventListener('click', () => go(idx - 1));
    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') go(idx + 1);
      if (e.key === 'ArrowLeft') go(idx - 1);
    });

    const cart = {};
    const toast = $('#toast');
    function showToast(t){ toast.textContent=t; toast.classList.add('on'); clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove('on'),1600); }
    function render(){
      const box=$('#cartItems'); box.innerHTML=''; let total=0, count=0;
      Object.entries(cart).forEach(([id,qty])=>{
        const item = MENU.find(x => x.id === id); if(!item) return;
        total += item.price * qty; count += qty;
        const c = document.createElement('div'); c.className='cline';
        c.innerHTML = `<b>${qty}×</b> ${item.name} <span style="opacity:.6">${money(item.price * qty)}</span><button class="x" data-id="${id}" aria-label="remove">✕</button>`;
        box.appendChild(c);
      });
      $('#cartTotal').textContent = money(total);
      $('#cart').classList.toggle('open', count > 0);
    }

    $('#addBtn').addEventListener('click', () => {
      const item = MENU[idx];
      cart[item.id] = (cart[item.id] || 0) + 1;
      render();
      showToast('added · ' + item.name);
    });

    document.addEventListener('click', (e) => {
      const x = e.target.closest('.cline .x');
      if (x) {
        delete cart[x.dataset.id];
        render();
      }
    });

    function order(){
      const ids = Object.entries(cart).filter(([, q]) => q > 0);
      if (!ids.length) {
        showToast('add something first ✨');
        return;
      }
      let total = 0;
      const lines = [];
      ids.forEach(([id, q]) => {
        const item = MENU.find(x => x.id === id);
        total += item.price * q;
        lines.push(`${q}× ${item.name} — ${money(item.price * q)}`);
      });
      const text = `Hello Le Rêve Café! I'd like to order:\n\n${lines.join('\n')}\n\nTotal: ${money(total)}`;
      window.open(`https://wa.me/254794053291?text=${encodeURIComponent(text)}`, '_blank');
    }

    $('#orderNow').addEventListener('click', order);
    $('#orderPill').addEventListener('click', order);
    $('#cartClose').addEventListener('click', () => $('#cart').classList.remove('open'));

    const first = MENU[0];
    applyColors(first);
    showWord(first.word);
    showChips(first.chips);
    showCard(first, false);
    $('#drinkImg').src = first.img;
  </script>
</body>
</html>
